# Litestream: copia continua de la base SQLite a un almacenamiento compatible con S3 (por ejemplo Backblaze B2, gratis).
# Los valores se leen de variables de entorno (se cargan en el panel de Render, nunca en este archivo).
dbs:
  - path: ${DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: zimerman/app.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        force-path-style: true
