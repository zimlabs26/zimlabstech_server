# Plantilla para Render GRATIS ("New > Blueprint"). No usa disco persistente (el plan gratis no lo tiene):
# la base SQLite se respalda en un almacenamiento gratuito con Litestream (ver start.sh y litestream.yml).
services:
  - type: web
    name: zimerman-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build && sh scripts/get-litestream.sh
    startCommand: sh start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Vercel reenvia /api hacia Render: hay dos proxies delante del servidor.
      - key: TRUST_PROXY
        value: 2
      # Direccion de la web (sin barra final). Se carga a mano en el panel de Render.
      - key: WEB_ORIGIN
        sync: false
      # Primera cuenta (el plan gratis no tiene Shell): se crea el super admin si la base esta vacia.
      # Borra BOOTSTRAP_SUPER_PASSWORD del panel despues del primer ingreso.
      - key: BOOTSTRAP_SUPER_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPER_PASSWORD
        sync: false
      # Respaldo de la base (Backblaze B2 u otro almacenamiento compatible con S3). Se cargan a mano.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
